name: Publish to npm

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      # 必须先按 lock 安装：npm ci 要求 package.json 与 lock 完全一致，
      # 而下面「Sync version from tag」会改 package.json 的版本号，顺序不能颠倒
      - name: Install dependencies
        working-directory: cli
        run: npm ci --ignore-scripts

      # 发布前先过冒烟测试，避免把坏版本推上 npm
      - name: Smoke test (offline)
        working-directory: cli
        run: npm test

      - name: Sync version from tag
        working-directory: cli
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          echo "Publishing version: $TAG"
          npm version "$TAG" --no-git-tag-version --allow-same-version

      - name: Publish to npm
        working-directory: cli
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to GitHub Packages
        working-directory: cli
        run: |
          # scope 必须等于仓库 owner（GitHub Packages 规则），用仓库变量而不是硬编码，
          # 这样 fork/改名后不会因为 owner 不匹配而失败；npm scope 要求全小写
          export OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "@${OWNER}:registry=https://npm.pkg.github.com" > ~/.npmrc
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> ~/.npmrc
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf-8'));
            pkg.name = '@' + process.env.OWNER + '/toutiao-ops';
            pkg.publishConfig = { registry: 'https://npm.pkg.github.com' };
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
