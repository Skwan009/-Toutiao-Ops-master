name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: cli/package-lock.json

      # --ignore-scripts：冒烟测试不启动浏览器，无需下载 Chromium
      - name: Install dependencies
        working-directory: cli
        run: npm ci --ignore-scripts

      - name: Smoke test (offline, no browser)
        working-directory: cli
        run: npm test
