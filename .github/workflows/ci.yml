name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: cli/package-lock.json

      # --ignore-scripts：冒烟测试不启动浏览器，无需下载 Chromium
      - name: Install dependencies
        working-directory: cli
        run: npm ci --ignore-scripts

      # 与 Makefile 的 check 目标等价：tools/ 下的一次性脚本此前从未做过语法校验
      - name: Syntax check (src / tools / test)
        working-directory: cli
        run: |
          find src tools test -type f \( -name '*.js' -o -name '*.mjs' \) -print0 \
            | xargs -0 -n1 node --check

      - name: Smoke test (offline, no browser)
        working-directory: cli
        run: npm test
